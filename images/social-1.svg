<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="socBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1224"/>
      <stop offset="100%" stop-color="#060811"/>
    </linearGradient>
    <filter id="sDrop" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#socBg)"/>
  <!-- Left Smartphone: Instagram Grid Profile -->
  <g filter="url(#sDrop)" transform="translate(55, 45) rotate(-4)">
    <rect x="0" y="0" width="215" height="410" rx="28" fill="#141826" stroke="#363E58" stroke-width="3"/>
    <rect x="70" y="12" width="75" height="14" rx="7" fill="#080A10"/>
    <!-- Profile Header -->
    <circle cx="48" cy="64" r="22" fill="#FF4D29"/>
    <rect x="82" y="50" width="90" height="10" rx="5" fill="#FFFFFF"/>
    <rect x="82" y="68" width="60" height="7" rx="3.5" fill="#D4FF33"/>
    <!-- 3x3 Instagram Visual Grid -->
    <rect x="16" y="105" width="56" height="56" rx="6" fill="#FF4D29"/>
    <rect x="79" y="105" width="56" height="56" rx="6" fill="#D4FF33"/>
    <rect x="142" y="105" width="56" height="56" rx="6" fill="#2563EB"/>
    <rect x="16" y="168" width="56" height="56" rx="6" fill="#2563EB"/>
    <rect x="79" y="168" width="56" height="56" rx="6" fill="#F6F4EF"/>
    <rect x="142" y="168" width="56" height="56" rx="6" fill="#FF4D29"/>
    <rect x="16" y="231" width="182" height="145" rx="12" fill="#2563EB"/>
    <circle cx="107" cy="303" r="38" fill="#D4FF33"/>
    <polygon points="98,288 98,318 124,303" fill="#111317"/>
  </g>
  <!-- Center Floating Carousel Post Card 1 -->
  <g filter="url(#sDrop)" transform="translate(295, 55)">
    <rect x="0" y="0" width="235" height="295" rx="18" fill="#D4FF33"/>
    <circle cx="117" cy="115" r="58" fill="#111317"/>
    <path d="M90 115 L117 78 L144 115 L117 152 Z" fill="#D4FF33"/>
    <rect x="28" y="198" width="178" height="16" rx="8" fill="#111317"/>
    <rect x="28" y="224" width="135" height="12" rx="6" fill="#111317" opacity="0.7"/>
    <rect x="28" y="252" width="95" height="26" rx="13" fill="#FF4D29"/>
  </g>
  <!-- Right Floating Ad Creative Card 2 -->
  <g filter="url(#sDrop)" transform="translate(545, 95) rotate(5)">
    <rect x="0" y="0" width="210" height="295" rx="18" fill="#FF4D29"/>
    <circle cx="105" cy="110" r="54" fill="#FFFFFF"/>
    <circle cx="105" cy="110" r="24" fill="#2563EB"/>
    <rect x="26" y="192" width="158" height="14" rx="7" fill="#FFFFFF"/>
    <rect x="26" y="216" width="115" height="10" rx="5" fill="#FFE0D9"/>
    <rect x="26" y="246" width="158" height="32" rx="16" fill="#111317"/>
  </g>
  <!-- Bottom Analytics Growth Pill -->
  <g filter="url(#sDrop)" transform="translate(295, 375)">
    <rect x="0" y="0" width="445" height="72" rx="14" fill="#181E30" stroke="#364268" stroke-width="1.5"/>
    <polyline points="28,50 75,30 118,42 168,18 215,24" fill="none" stroke="#10B981" stroke-width="4"/>
    <circle cx="168" cy="18" r="6" fill="#D4FF33"/>
    <rect x="245" y="20" width="165" height="12" rx="6" fill="#FFFFFF"/>
    <rect x="245" y="40" width="115" height="9" rx="4.5" fill="#10B981"/>
  </g>
</svg>
