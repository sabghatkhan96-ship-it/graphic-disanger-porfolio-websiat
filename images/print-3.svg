<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="magBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22201D"/>
      <stop offset="100%" stop-color="#12110F"/>
    </linearGradient>
    <linearGradient id="pageCurveL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EAE4D8"/>
      <stop offset="92%" stop-color="#F7F4EC"/>
      <stop offset="100%" stop-color="#C9C1B2"/>
    </linearGradient>
    <linearGradient id="pageCurveR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9C1B2"/>
      <stop offset="8%" stop-color="#F7F4EC"/>
      <stop offset="100%" stop-color="#EAE4D8"/>
    </linearGradient>
    <filter id="mDrop" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#magBg)"/>
  <!-- Open 3D Architectural Magazine Spread with Curved Spine Shading -->
  <g filter="url(#mDrop)" transform="translate(85, 55)">
    <!-- Hardcover Backing -->
    <rect x="-10" y="-8" width="650" height="396" rx="10" fill="#C8321E"/>
    <!-- Left Page -->
    <rect x="0" y="0" width="315" height="380" rx="4" fill="url(#pageCurveL)"/>
    <!-- Right Page -->
    <rect x="315" y="0" width="315" height="380" rx="4" fill="url(#pageCurveR)"/>
    <!-- Left Editorial Visual Layout -->
    <rect x="32" y="34" width="250" height="195" rx="6" fill="#18181B"/>
    <circle cx="157" cy="131" r="62" fill="#C8321E"/>
    <polygon points="157,85 198,158 116,158" fill="#F7F4EC"/>
    <rect x="32" y="255" width="185" height="16" rx="8" fill="#18181B"/>
    <rect x="32" y="282" width="240" height="8" rx="4" fill="#8C857B"/>
    <rect x="32" y="298" width="220" height="8" rx="4" fill="#8C857B"/>
    <rect x="32" y="314" width="160" height="8" rx="4" fill="#8C857B"/>
    <!-- Right Editorial Two-Column Grid -->
    <rect x="350" y="34" width="248" height="18" rx="9" fill="#C8321E"/>
    <rect x="350" y="72" width="116" height="155" rx="6" fill="#C8321E"/>
    <circle cx="408" cy="149" r="34" fill="#F7F4EC"/>
    <rect x="482" y="72" width="116" height="155" rx="6" fill="#18181B"/>
    <circle cx="540" cy="149" r="34" fill="none" stroke="#D4FF33" stroke-width="8"/>
    <rect x="350" y="252" width="116" height="8" rx="4" fill="#8C857B"/>
    <rect x="350" y="268" width="116" height="8" rx="4" fill="#8C857B"/>
    <rect x="482" y="252" width="116" height="8" rx="4" fill="#8C857B"/>
    <rect x="482" y="268" width="96" height="8" rx="4" fill="#8C857B"/>
  </g>
</svg>
