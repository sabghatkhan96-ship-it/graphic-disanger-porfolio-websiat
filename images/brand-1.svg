<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5A36"/>
      <stop offset="100%" stop-color="#D92B04"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Subtle Studio Spotlight -->
  <circle cx="400" cy="220" r="280" fill="#FF4D29" opacity="0.08"/>
  <!-- Open Brand Guidelines Hardcover Book (Isometric Flatlay) -->
  <g filter="url(#shadow)" transform="translate(55, 55)">
    <rect x="0" y="0" width="215" height="290" rx="6" fill="#F6F4EF"/>
    <rect x="215" y="0" width="215" height="290" rx="6" fill="#ECE8DF"/>
    <line x1="215" y1="0" x2="215" y2="290" stroke="#C7C2B6" stroke-width="3"/>
    <!-- Left Page: Color Swatch Grid -->
    <rect x="22" y="26" width="80" height="80" rx="6" fill="url(#accentGrad)"/>
    <rect x="112" y="26" width="80" height="80" rx="6" fill="#12151E"/>
    <rect x="22" y="116" width="80" height="50" rx="6" fill="#D4FF33"/>
    <rect x="112" y="116" width="80" height="50" rx="6" fill="#2563EB"/>
    <rect x="22" y="185" width="170" height="8" rx="4" fill="#D0C9BC"/>
    <rect x="22" y="202" width="140" height="8" rx="4" fill="#D0C9BC"/>
    <rect x="22" y="219" width="155" height="8" rx="4" fill="#D0C9BC"/>
    <!-- Right Page: 3D Geometric Logo Emblem -->
    <rect x="237" y="26" width="170" height="165" rx="8" fill="#12151E"/>
    <circle cx="322" cy="108" r="50" fill="url(#accentGrad)"/>
    <polygon points="322,72 354,126 290,126" fill="#FFFFFF"/>
    <circle cx="322" cy="112" r="10" fill="#12151E"/>
    <rect x="237" y="210" width="120" height="12" rx="6" fill="#12151E"/>
    <rect x="237" y="232" width="165" height="8" rx="4" fill="#C7C2B6"/>
  </g>
  <!-- Floating Matte Black Business Cards Stack -->
  <g filter="url(#shadow)" transform="translate(515, 65) rotate(6)">
    <rect x="14" y="18" width="220" height="130" rx="10" fill="url(#accentGrad)"/>
    <rect x="0" y="0" width="220" height="130" rx="10" fill="#161922" stroke="#2E3446" stroke-width="1.5"/>
    <circle cx="52" cy="65" r="26" fill="url(#accentGrad)"/>
    <polygon points="52,46 69,75 35,75" fill="#FFFFFF"/>
    <rect x="94" y="50" width="95" height="10" rx="5" fill="#FFFFFF"/>
    <rect x="94" y="68" width="68" height="7" rx="3.5" fill="#FF5A36"/>
    <rect x="94" y="84" width="82" height="6" rx="3" fill="#646A7A"/>
  </g>
  <!-- Floating Smartphone App Brand Preview -->
  <g filter="url(#shadow)" transform="translate(525, 235) rotate(-4)">
    <rect x="0" y="0" width="210" height="215" rx="22" fill="#0E1016" stroke="#353C4F" stroke-width="3"/>
    <rect x="68" y="10" width="74" height="14" rx="7" fill="#050608"/>
    <rect x="16" y="36" width="178" height="90" rx="12" fill="url(#accentGrad)"/>
    <circle cx="52" cy="81" r="22" fill="#FFFFFF" opacity="0.22"/>
    <rect x="86" y="66" width="88" height="10" rx="5" fill="#FFFFFF"/>
    <rect x="86" y="84" width="60" height="8" rx="4" fill="#FFE2DA"/>
    <rect x="16" y="140" width="84" height="54" rx="10" fill="#181C26"/>
    <rect x="110" y="140" width="84" height="54" rx="10" fill="#181C26"/>
  </g>
  <!-- Embossed Wax/Foil Brand Seal Coin -->
  <g filter="url(#shadow)" transform="translate(115, 395)">
    <circle cx="0" cy="0" r="44" fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#FFFFFF" stroke-dasharray="4 4"/>
    <polygon points="0,-18 16,12 -16,12" fill="#FFFFFF"/>
  </g>
  <!-- Golden Ratio Construction Overlay -->
  <g transform="translate(215, 375)">
    <rect x="0" y="0" width="265" height="75" rx="10" fill="#161922" stroke="#2B3040"/>
    <circle cx="38" cy="38" r="22" fill="none" stroke="#FF5A36" stroke-width="2"/>
    <circle cx="50" cy="38" r="14" fill="none" stroke="#D4FF33" stroke-width="1.5"/>
    <rect x="82" y="22" width="150" height="10" rx="5" fill="#F6F4EF"/>
    <rect x="82" y="40" width="110" height="8" rx="4" fill="#FF5A36"/>
  </g>
</svg>
