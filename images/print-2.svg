<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wallBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1C22"/>
      <stop offset="100%" stop-color="#0D0E12"/>
    </linearGradient>
    <filter id="frameDrop" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#wallBg)"/>
  <!-- Three Framed Gallery Exhibition Silkscreen Posters -->
  <!-- Frame 1: Acid Yellow Swiss Geometric Poster -->
  <g filter="url(#frameDrop)" transform="translate(55, 55)">
    <rect x="0" y="0" width="210" height="310" rx="4" fill="#D4FF33" stroke="#090A0D" stroke-width="10"/>
    <circle cx="105" cy="125" r="64" fill="#111317"/>
    <rect x="41" y="125" width="128" height="64" fill="#FF4D29"/>
    <rect x="35" y="225" width="140" height="14" rx="7" fill="#111317"/>
    <rect x="35" y="248" width="95" height="10" rx="5" fill="#111317" opacity="0.65"/>
  </g>
  <!-- Frame 2: Vermilion Bauhaus Exhibition Poster -->
  <g filter="url(#frameDrop)" transform="translate(295, 40)">
    <rect x="0" y="0" width="210" height="310" rx="4" fill="#FF4D29" stroke="#090A0D" stroke-width="10"/>
    <circle cx="105" cy="115" r="60" fill="none" stroke="#FFFFFF" stroke-width="18"/>
    <polygon points="105,85 138,145 72,145" fill="#D4FF33"/>
    <rect x="35" y="220" width="140" height="14" rx="7" fill="#FFFFFF"/>
    <rect x="35" y="244" width="100" height="10" rx="5" fill="#FFE0D9"/>
  </g>
  <!-- Frame 3: Cobalt Architectural Grid Poster -->
  <g filter="url(#frameDrop)" transform="translate(535, 55)">
    <rect x="0" y="0" width="210" height="310" rx="4" fill="#F6F4EF" stroke="#090A0D" stroke-width="10"/>
    <rect x="32" y="34" width="146" height="146" fill="#2563EB"/>
    <circle cx="105" cy="107" r="44" fill="#FF4D29"/>
    <rect x="32" y="210" width="146" height="14" rx="7" fill="#111317"/>
    <rect x="32" y="234" width="110" height="10" rx="5" fill="#2563EB"/>
  </g>
  <!-- Bottom VIP Lanyard Pass & Ticket Stub -->
  <g filter="url(#frameDrop)" transform="translate(185, 390)">
    <rect x="0" y="0" width="430" height="72" rx="12" fill="#161922" stroke="#D4FF33" stroke-width="1.5"/>
    <rect x="18" y="16" width="85" height="40" rx="6" fill="#D4FF33"/>
    <rect x="125" y="20" width="185" height="12" rx="6" fill="#FFFFFF"/>
    <rect x="125" y="40" width="130" height="8" rx="4" fill="#9CA1AB"/>
    <circle cx="385" cy="36" r="18" fill="#FF4D29"/>
  </g>
</svg>
