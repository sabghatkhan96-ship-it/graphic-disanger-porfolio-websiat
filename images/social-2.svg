<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ytBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A141D"/>
      <stop offset="100%" stop-color="#05080D"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="yDrop" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#ytBg)"/>
  <!-- YouTube High-CTR Video Player & Banner Mockup -->
  <g filter="url(#yDrop)" transform="translate(65, 45)">
    <rect x="0" y="0" width="465" height="295" rx="16" fill="#131C26" stroke="#253547" stroke-width="2"/>
    <rect x="18" y="18" width="429" height="215" rx="12" fill="url(#neonGrad)"/>
    <circle cx="232" cy="125" r="46" fill="#FFFFFF"/>
    <polygon points="222,106 222,144 254,125" fill="#091E1A"/>
    <!-- Graphic Badges inside Thumbnail -->
    <rect x="38" y="38" width="110" height="28" rx="6" fill="#111317"/>
    <circle cx="385" cy="75" r="34" fill="#D4FF33"/>
    <rect x="18" y="250" width="240" height="14" rx="7" fill="#FFFFFF"/>
    <rect x="18" y="270" width="140" height="9" rx="4.5" fill="#10B981"/>
  </g>
  <!-- LinkedIn & X/Twitter Launch Cards Stack -->
  <g filter="url(#yDrop)" transform="translate(555, 65) rotate(4)">
    <rect x="0" y="0" width="195" height="180" rx="14" fill="#1B2636" stroke="#10B981" stroke-width="2"/>
    <circle cx="97" cy="76" r="42" fill="none" stroke="#10B981" stroke-width="10"/>
    <rect x="32" y="138" width="130" height="12" rx="6" fill="#FFFFFF"/>
  </g>
  <g filter="url(#yDrop)" transform="translate(555, 265) rotate(-3)">
    <rect x="0" y="0" width="195" height="180" rx="14" fill="#D4FF33"/>
    <circle cx="97" cy="76" r="42" fill="#111317"/>
    <polygon points="97,50 120,92 74,92" fill="#10B981"/>
    <rect x="32" y="138" width="130" height="12" rx="6" fill="#111317"/>
  </g>
  <!-- Bottom Channel Banner Strip -->
  <g filter="url(#yDrop)" transform="translate(65, 365)">
    <rect x="0" y="0" width="465" height="85" rx="14" fill="#131C26" stroke="#253547"/>
    <circle cx="48" cy="42" r="24" fill="#10B981"/>
    <rect x="88" y="26" width="190" height="12" rx="6" fill="#FFFFFF"/>
    <rect x="88" y="46" width="130" height="9" rx="4.5" fill="#9CA1AB"/>
    <rect x="335" y="24" width="105" height="36" rx="18" fill="#FF4D29"/>
  </g>
</svg>
